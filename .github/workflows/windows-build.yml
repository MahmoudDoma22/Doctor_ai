name: Doctor AI clean Windows build
on:
  push:
    branches: ["rebuild/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-ai-clean-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Configure desktop
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DCMAKE_BUILD_TYPE=Release
      - name: Build desktop
        run: cmake --build build --config Release
      - name: Test backend
        run: mvn -f backend/pom.xml test package
      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build -Filter DoctorAI.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Desktop executable not found" }
          New-Item -ItemType Directory -Force package/desktop,package/backend | Out-Null
          Copy-Item "$($exe.DirectoryName)/*" package/desktop -Recurse -Force
          windeployqt --release (Resolve-Path package/desktop/DoctorAI.exe)
          $jar = Get-ChildItem backend/target -Filter *.jar | Where-Object { $_.Name -notlike "original-*" } | Select-Object -First 1
          if (-not $jar) { throw "Spring Boot JAR not found" }
          Copy-Item $jar.FullName package/backend/doctor-ai-backend.jar
          & "$env:JAVA_HOME/bin/jlink.exe" --add-modules java.base,java.logging,java.naming,java.desktop,java.management,java.instrument,java.security.jgss,java.sql,jdk.crypto.ec --strip-debug --no-man-pages --no-header-files --compress=2 --output package/runtime
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path package/runtime/bin/java.exe)) { throw "Bundled Java runtime creation failed" }
          Copy-Item installer/Start-DoctorAI.ps1 package/Start-DoctorAI.ps1
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc installer/DoctorAI.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path installer-output/DoctorAI-Setup.exe)) { throw "Installer output missing" }
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: DoctorAI-Windows-Installer
          path: installer-output/DoctorAI-Setup.exe
          if-no-files-found: error
