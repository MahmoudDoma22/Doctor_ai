name: Doctor AI Rust Windows build
on:
  push:
    branches: ["rebuild/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-ai-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Verify Rust-only source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $legacy = @("backend", "desktop", "CMakeLists.txt", "installer/Install-Model.ps1", "installer/Start-DoctorAI.ps1", "installer/Start-DoctorAI.vbs")
          foreach ($path in $legacy) { if (Test-Path $path) { throw "Legacy runtime component still exists: $path" } }
          $hits = Get-ChildItem -Recurse -File -Exclude "*.ico" | Select-String -Pattern ("olla" + "ma") -SimpleMatch -CaseSensitive:$false
          if ($hits) { throw "Forbidden legacy model-manager reference found: $($hits[0].Path)" }
      - name: Format and parse Rust sources
        run: |
          cargo fmt --manifest-path rust-app/Cargo.toml
          cargo fmt --manifest-path rust-app/Cargo.toml -- --check
      - name: Enable long paths for Rust dependency tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
      - name: Build native Rust desktop
        run: cargo build --manifest-path rust-app/Cargo.toml --release --target x86_64-pc-windows-msvc
      - name: Test Rust desktop
        run: cargo test --manifest-path rust-app/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Acquire pinned official Rust inference engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force external/mistralrs | Out-Null
          $archive = "external/mistralrs/mistralrs-cpu-windows.zip"
          $url = "https://github.com/EricLBuehler/mistral.rs/releases/download/v0.9.5/mistralrs-cpu-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "64d567c299a5c97ef265aa0362649aafb968af47706810df640f74fe8ea4702a"
          if ($actual -ne $expected) { throw "mistral.rs release checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath external/mistralrs/unpacked -Force
          $binary = Get-ChildItem external/mistralrs/unpacked -Filter mistralrs.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "Official Windows CPU release did not contain mistralrs.exe" }
          Copy-Item $binary.FullName external/mistralrs/mistralrs.exe -Force
          $engine = "external/mistralrs/mistralrs.exe"
          if ((Get-Item $engine).Length -lt 10MB) { throw "mistralrs.exe is unexpectedly small" }
          & $engine --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Rust inference engine CLI smoke test failed" }
          & $engine serve --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Rust inference server command smoke test failed" }
      - name: Stage Rust application and icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package/runtime/mistralrs | Out-Null
          Copy-Item rust-app/target/x86_64-pc-windows-msvc/release/doctor-ai.exe package/DoctorAI.exe
          Copy-Item external/mistralrs/mistralrs.exe package/runtime/mistralrs/mistralrs.exe
          $icon = Get-ChildItem rust-app/target -Filter doctor-ai.ico -Recurse | Select-Object -First 1
          if (-not $icon) { throw "Generated executable icon not found" }
          Copy-Item $icon.FullName package/DoctorAI.ico
          if ((Get-Item package/DoctorAI.exe).Length -lt 1MB) { throw "DoctorAI.exe is unexpectedly small" }
          if ((Get-Item package/runtime/mistralrs/mistralrs.exe).Length -lt 1MB) { throw "mistralrs.exe is unexpectedly small" }
          if ((Get-Item package/DoctorAI.ico).Length -lt 1KB) { throw "DoctorAI.ico is unexpectedly small" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { throw "Inno Setup compiler missing" }
      - name: Build selectable Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/DoctorAI.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path installer-output/DoctorAI-Setup.exe)) { throw "Installer output missing" }
          if ((Get-Item installer-output/DoctorAI-Setup.exe).Length -lt 10MB) { throw "Installer output is unexpectedly small" }
      - name: Smoke-test custom install directory and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "DoctorAI-Install-Test"
          $installLog = Join-Path $env:RUNNER_TEMP "DoctorAI-Install.log"
          $setup = (Resolve-Path "installer-output/DoctorAI-Setup.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$installLog", "/DIR=$testDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 80 }
            throw "Silent installer smoke test failed with exit code $($install.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $testDir "DoctorAI.exe"))) { throw "Installed desktop executable is missing" }
          if (-not (Test-Path (Join-Path $testDir "runtime/mistralrs/mistralrs.exe"))) { throw "Installed Rust inference engine is missing" }
          $uninstaller = Join-Path $testDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not created" }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru -Wait
          if ($remove.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($remove.ExitCode)" }
          if (Test-Path (Join-Path $testDir "DoctorAI.exe")) { throw "Uninstaller left DoctorAI.exe behind" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: DoctorAI-Windows-Installer
          path: installer-output/DoctorAI-Setup.exe
          if-no-files-found: error
